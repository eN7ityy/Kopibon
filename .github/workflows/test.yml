name: Test Release
on:
  push:
    branches: [test]

jobs:
  build:
    runs-on: [self-hosted, linux, doujin-builder]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # Auto-bump the prerelease version, e.g. 1.0.0-beta.0, 1.0.0-beta.1...
      - run: npm version prerelease --preid=beta --no-git-tag-version

      - run: npm run build:linux

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: v$(node -p "require('./package.json').version")
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.rpm
            dist/*.deb
            dist/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
