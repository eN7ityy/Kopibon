[package]
name = "kopibon"
version = "1.0.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Kopibon 2.x Tauri shell: existing React renderer against kopibon-core (Phase B)"

[lints]
rust.warnings = "deny"
clippy.all = "deny"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
rusqlite = { version = "0.37" }
# Phase A core. B1 only needs it to link; B2's command layer calls it.
kopibon-core = { path = "../kopibon-core" }
ureq = "3.4.0"
keyring = "4.2.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
sysinfo = "0.39.6"
tauri-plugin-updater = "2.11.0"
semver = "1.0.28"
tauri-plugin-notification = "2.4.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
sha1 = "0.11.0"
base64 = "0.23.1"
