[workspace]
resolver = "2"
members = ["kopibon-core"]
exclude = ["src-tauri"]
# src-tauri is a separate Cargo project (own target dir + lockfile), per the
# Tauri convention for repos with an existing workspace: `cargo test
# --workspace` (the Phase A gate) must keep building without webkit link
# deps, and the Tauri CLI owns src-tauri's build. B2 links kopibon-core in
# via a path dependency from src-tauri/Cargo.toml.

# Warning lints are denied here so local behaviour and the CI gate (clippy
# -D warnings, 11 §3.1) agree; there is no pre-commit enforcement.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
lopdf = "0.36"
pdfium-render = "0.9"
regex = "1"
crc32fast = "1"
sha1 = "0.10"
jiff = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
