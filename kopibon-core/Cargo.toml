[package]
name = "kopibon-core"
version = "2.0.0-alpha.1"
edition = "2021"
license = "GPL-3.0"
description = "Kopibon 2.x headless core: metadata engine, library, pumps"

[dependencies]
# Per-WP additions land here as the work packages build; the workspace
# Cargo.toml owns the versions (08/01 §2).
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crc32fast = { workspace = true }
sha1 = { workspace = true }
jiff = { workspace = true }
lopdf = { workspace = true }
ryu-js = "1.0.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
rusqlite.workspace = true

[dev-dependencies]
ryu = "1.0.23"

[lib]
name = "kopibon_core"
path = "src/lib.rs"

[[bin]]
name = "kopibon"
path = "src/cli/main.rs"

[lints]
workspace = true
